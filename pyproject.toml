[project]
name = "aiotic-sdk"
dynamic = ["version"]
description = "AIOTIC integration SDK: typed API client, ERP receive endpoint, validation pipeline, master-data sync, order watcher and a mock AIOTIC server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DevOps Company", email = "info@devopscompany.nl" }]
keywords = ["aiotic", "erp", "integration", "purchase-order", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
cli = ["typer>=0.12", "rich>=13"]
all = ["aiotic-sdk[server,cli]"]

[project.scripts]
aiotic = "aiotic.cli:main"

[project.urls]
Documentation = "https://developers.aiotic.ai"
Homepage = "https://www.aiotic.ai"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aiotic/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aiotic"]

[tool.uv]
dev-dependencies = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
